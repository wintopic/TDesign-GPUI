[package]
name = "tdesign-gpui"
description = "A native GPUI implementation of the TDesign desktop component system"
keywords = ["tdesign", "gpui", "gui", "components"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "Cargo.toml"]

[features]
default = ["full-icons"]
full-icons = ["tdesign-gpui-assets/full-icons"]
serde = ["dep:serde", "tdesign-gpui-assets/serde"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
gpui.workspace = true
qrcodegen.workspace = true
serde = { workspace = true, optional = true }
tdesign-gpui-assets = { path = "../tdesign-gpui-assets", version = "0.1.0", default-features = false }

[dev-dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
