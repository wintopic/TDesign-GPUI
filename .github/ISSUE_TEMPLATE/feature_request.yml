name: Feature request
description: Propose a component, API, native adaptation, or developer-experience improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: input
    id: area
    attributes:
      label: Component or area
      placeholder: Select, theme, documentation, upstream sync
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the concrete user need and why current APIs are insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Rust/GPUI API or behavior
      description: Include a small builder/state/event example when possible.
      render: rust
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: TDesign or GPUI reference
      description: Link the exact React PC documentation, API field, issue, source, or GPUI contract.
      placeholder: https://tdesign.tencent.com/react/components/...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other native mappings you evaluated.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request targets native desktop GPUI, not Mobile, AI Chat/Pro, miniprogram, UniApp, or WASM.
          required: true
        - label: I searched existing issues, pull requests, and parity records.
          required: true
