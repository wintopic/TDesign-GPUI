name: Upstream sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes classified as sync-safe
        required: false
        default: true
        type: boolean
      refs:
        description: Optional comma-separated source=ref overrides
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - name: Inspect and apply safe upstream changes
        id: sync
        shell: bash
        env:
          UPSTREAM_REFS: ${{ inputs.refs }}
          SHOULD_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=(upstream check --json artifacts/upstream-report.json)
          if [[ "$SHOULD_APPLY" == "true" ]]; then
            args=(upstream sync --apply --json artifacts/upstream-report.json)
          fi
          while IFS= read -r pair; do
            pair="${pair#"${pair%%[![:space:]]*}"}"
            pair="${pair%"${pair##*[![:space:]]}"}"
            if [[ -n "$pair" ]]; then
              args+=(--ref "$pair")
            fi
          done < <(printf '%s' "$UPSTREAM_REFS" | tr ',' '\n')
          cargo xtask "${args[@]}"
          status="$(jq -r '.overall' artifacts/upstream-report.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "review-required" ]]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "label=upstream-review" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "label=sync-safe" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure synchronization labels exist
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sync-safe --color 0e8a16 --description "Changes classified as safe to synchronize" --force
          gh label create upstream-review --color d93f0b --description "Upstream changes require maintainer review" --force
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: artifacts/upstream-report.json
      - name: Install current stable toolchain for GPUI canary
        if: always()
        uses: dtolnay/rust-toolchain@stable
      - name: Validate against Zed main GPUI
        if: always()
        id: canary
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          zed_dir="$RUNNER_TEMP/tdesign-gpui-zed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git clone --depth 1 https://github.com/zed-industries/zed.git "$zed_dir"
          cargo check -p tdesign-gpui --all-features \
            --config "patch.crates-io.gpui.path='$zed_dir/crates/gpui'" \
            2>&1 | tee artifacts/gpui-canary.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload GPUI canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-main-canary
          path: artifacts/gpui-canary.log
      - name: Annotate upstream report with canary result
        if: always()
        continue-on-error: true
        run: >-
          cargo xtask upstream canary
          --json artifacts/upstream-report.json
          --status "${{ steps.canary.outcome }}"
          --log artifacts/gpui-canary.log
      - name: Run generated-change checks
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          cargo fmt --all -- --check
          cargo xtask parity generate
          cargo test --workspace
          cargo xtask parity check
          cargo xtask release check
      - name: Create or update upstream pull request
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-sync
          delete-branch: true
          draft: ${{ steps.sync.outputs.draft == 'true' || steps.canary.outcome == 'failure' }}
          title: "chore: synchronize upstream TDesign and GPUI refs"
          commit-message: "chore: synchronize upstream refs"
          labels: ${{ steps.canary.outcome == 'failure' && 'upstream-review' || steps.sync.outputs.label }}
          body: |
            Generated by `cargo xtask upstream sync --apply`.

            Classification: `${{ steps.sync.outputs.status }}`.
            GPUI main canary: `${{ steps.canary.outcome }}` (see the `gpui-main-canary` artifact).
            Review-required changes are listed in `upstream/review-report.md`.
      - name: Enable auto-merge for sync-safe changes
        if: ${{ steps.sync.outputs.status == 'sync-safe' && steps.canary.outcome != 'failure' && steps.pull-request.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.pull-request.outputs.pull-request-number }}"
