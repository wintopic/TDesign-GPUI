name: Upstream sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes classified as sync-safe
        required: false
        default: true
        type: boolean
      refs:
        description: Optional comma-separated source=ref overrides
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: Restore Cargo build cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-upstream-sync-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-upstream-sync-
      - name: Inspect and apply safe upstream changes
        id: sync
        shell: bash
        env:
          UPSTREAM_REFS: ${{ inputs.refs }}
          SHOULD_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=(upstream check --json artifacts/upstream-report.json)
          if [[ "$SHOULD_APPLY" == "true" ]]; then
            args=(upstream sync --apply --json artifacts/upstream-report.json)
          fi
          while IFS= read -r pair; do
            pair="${pair#"${pair%%[![:space:]]*}"}"
            pair="${pair%"${pair##*[![:space:]]}"}"
            if [[ -n "$pair" ]]; then
              args+=(--ref "$pair")
            fi
          done < <(printf '%s' "$UPSTREAM_REFS" | tr ',' '\n')
          cargo run -p xtask --locked -- "${args[@]}"
          status="$(jq -r '.overall' artifacts/upstream-report.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "review-required" ]]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "label=upstream-review" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "label=sync-safe" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure synchronization labels exist
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sync-safe --color 0e8a16 --description "Changes classified as safe to synchronize" --force
          gh label create upstream-review --color d93f0b --description "Upstream changes require maintainer review" --force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-report
          path: artifacts/upstream-report.json
      - name: Validate against Zed main GPUI
        if: always()
        id: canary
        continue-on-error: true
        shell: bash
        run: |
          set +e
          artifacts_dir="$GITHUB_WORKSPACE/artifacts"
          canary_dir="$RUNNER_TEMP/tdesign-gpui-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$artifacts_dir" "$canary_dir"
          zed_dir="$RUNNER_TEMP/tdesign-gpui-zed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git clone --depth 1 https://github.com/zed-industries/zed.git "$zed_dir"
          rsync -a \
            --exclude .git \
            --exclude artifacts \
            --exclude target \
            --exclude upstream-cache \
            "$GITHUB_WORKSPACE/" "$canary_dir/"
          cd "$canary_dir"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/gpui-canary"
          cargo tree -p tdesign-gpui \
            --config "patch.crates-io.gpui.path='$zed_dir/crates/gpui'" \
            2>&1 | tee "$artifacts_dir/gpui-canary-tree.log"
          tree_status=${PIPESTATUS[0]}
          if [[ "$tree_status" -ne 0 ]] || ! grep -Fq "$zed_dir/crates/gpui" "$artifacts_dir/gpui-canary-tree.log"; then
            echo "GPUI path patch did not take effect" | tee -a "$artifacts_dir/gpui-canary.log"
            exit 1
          fi
          cargo check -p tdesign-gpui --all-features \
            --locked \
            --config "patch.crates-io.gpui.path='$zed_dir/crates/gpui'" \
            2>&1 | tee "$artifacts_dir/gpui-canary.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload GPUI canary diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpui-main-canary
          path: artifacts/gpui-canary*.log
      - name: Annotate upstream report with canary result
        if: always()
        continue-on-error: true
        run: >-
          cargo run -p xtask --locked -- upstream canary
          --json artifacts/upstream-report.json
          --status "${{ steps.canary.outcome }}"
          --log artifacts/gpui-canary.log
      - name: Run generated-change checks
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          cargo fmt --all -- --check
          cargo run -p xtask --locked -- parity generate
          cargo check -p tdesign-gpui --all-targets --no-default-features --locked
          cargo check -p tdesign-gpui-assets --all-targets --no-default-features --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo test --workspace --locked
          cargo run -p xtask --locked -- parity check
          cargo run -p xtask --locked -- release check
      - name: Create or update upstream pull request
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/upstream-sync
          delete-branch: true
          draft: ${{ steps.sync.outputs.draft == 'true' || steps.canary.outcome == 'failure' }}
          title: "chore: synchronize upstream TDesign and GPUI refs"
          commit-message: "chore: synchronize upstream refs"
          labels: ${{ steps.canary.outcome == 'failure' && 'upstream-review' || steps.sync.outputs.label }}
          body: |
            Generated by `cargo xtask upstream sync --apply`.

            Classification: `${{ steps.sync.outputs.status }}`.
            GPUI main canary: `${{ steps.canary.outcome }}` (see the `gpui-main-canary` artifact).
            Review-required changes are listed in the `upstream-report` workflow artifact.
      - name: Dispatch and await CI for the generated branch
        if: ${{ steps.pull-request.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="${{ steps.pull-request.outputs.pull-request-branch }}"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --ref "$branch" -f ref="$branch"
          for attempt in {1..30}; do
            run_id="$(gh run list --workflow ci.yml --event workflow_dispatch --branch "$branch" --limit 20 --json databaseId,displayTitle,createdAt --jq ".[] | select(.displayTitle == \"CI $branch\" and .createdAt >= \"$dispatched_at\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --exit-status
              exit $?
            fi
            sleep 10
          done
          echo "Timed out waiting for CI dispatch for $branch" >&2
          exit 1
      - name: Enable auto-merge for sync-safe changes
        if: ${{ steps.sync.outputs.status == 'sync-safe' && steps.canary.outcome != 'failure' && steps.pull-request.outputs.pull-request-number != '' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.pull-request.outputs.pull-request-number }}"
