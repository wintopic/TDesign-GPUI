name: CI
run-name: CI ${{ inputs.ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: Restore Cargo build cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo check -p tdesign-gpui --all-targets --no-default-features --locked
      - run: cargo check -p tdesign-gpui-assets --all-targets --no-default-features --locked
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run -p xtask --locked -- parity check
      - run: cargo run -p xtask --locked -- release check

  gpui-canary:
    name: GPUI main canary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: Restore Cargo build cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpui-canary-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gpui-canary-
      - name: Clone Zed outside the TDesign workspace
        shell: bash
        run: |
          zed_dir="$RUNNER_TEMP/tdesign-gpui-zed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git clone --depth 1 https://github.com/zed-industries/zed.git "$zed_dir"
          echo "ZED_DIR=$zed_dir" >> "$GITHUB_ENV"
      - name: Check against Zed main
        id: canary
        shell: bash
        run: |
          set +e
          artifacts_dir="$GITHUB_WORKSPACE/artifacts"
          canary_dir="$RUNNER_TEMP/tdesign-gpui-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$artifacts_dir" "$canary_dir"
          rsync -a \
            --exclude .git \
            --exclude artifacts \
            --exclude target \
            --exclude upstream-cache \
            "$GITHUB_WORKSPACE/" "$canary_dir/"
          cd "$canary_dir"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/gpui-canary"
          cargo tree -p tdesign-gpui \
            --config "patch.crates-io.gpui.path='$ZED_DIR/crates/gpui'" \
            2>&1 | tee "$artifacts_dir/gpui-canary-tree.log"
          tree_status=${PIPESTATUS[0]}
          if [[ "$tree_status" -ne 0 ]] || ! grep -Fq "$ZED_DIR/crates/gpui" "$artifacts_dir/gpui-canary-tree.log"; then
            echo "GPUI path patch did not take effect" | tee -a "$artifacts_dir/gpui-canary.log"
            exit 1
          fi
          cargo check -p tdesign-gpui --all-features \
            --locked \
            --config "patch.crates-io.gpui.path='$ZED_DIR/crates/gpui'" \
            2>&1 | tee "$artifacts_dir/gpui-canary.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish canary diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpui-main-canary
          path: artifacts/gpui-canary*.log
