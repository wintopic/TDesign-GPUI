name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: Restore Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-
      - name: Verify tag matches the workspace version
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "tdesign-gpui") | .version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "release tag ${GITHUB_REF_NAME} does not match workspace version v${version}" >&2
            exit 1
          }
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run -p xtask --locked -- release check
      - run: cargo package -p tdesign-gpui-assets --locked
      - run: cargo publish -p tdesign-gpui-assets --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo package -p tdesign-gpui --locked
      - run: cargo publish -p tdesign-gpui --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
