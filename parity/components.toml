  "Button", "Icon", "Link", "Typography", "Divider", "Grid", "Layout", "Space",
  "Affix", "Anchor", "BackTop", "Breadcrumb", "Dropdown", "Menu", "Pagination",
  "Steps", "StickyTool", "Tabs", "Alert", "Dialog", "Drawer", "Guide", "Message",
  "Notification", "Popconfirm", "Popup", "AutoComplete", "Cascader", "Checkbox",
  "ColorPicker", "DatePicker", "Form", "Input", "InputAdornment", "InputNumber",
  "TagInput", "Radio", "RangeInput", "Select", "SelectInput", "Slider", "Switch",
  "Textarea", "Transfer", "TimePicker", "TreeSelect", "Upload", "Avatar", "Badge",
  "Calendar", "Card", "Collapse", "Comment", "Descriptions", "Empty", "Image",
  "ImageViewer", "List", "Loading", "Progress", "QRCode", "Skeleton", "Statistic",
  "Swiper", "Table", "Tag", "Timeline", "Tooltip", "Tree", "Watermark", "Rate",
]

[config_provider]
react = "ConfigProvider"
